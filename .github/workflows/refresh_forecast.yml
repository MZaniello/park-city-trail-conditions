name: Refresh trail forecast

on:
  workflow_dispatch:

  schedule:
    - cron: "17 6 * * *"
      timezone: "America/Denver"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests

      - name: Download latest forecast
        run: python src/forecast/download_master_group_forecast.py

      - name: Build forecast features
        run: python src/forecast/build_master_forecast_features.py

      - name: Generate v3.2 predictions
        run: python src/forecast/predict_master_forecast_v3_2.py

      - name: Commit refreshed dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/raw/master_trail_forecast.csv
          git add data/processed/master_forecast_condition_predictions_v3_2.csv

          if git diff --cached --quiet; then
            echo "No forecast changes to commit."
          else
            git commit -m "Refresh trail forecast data"
            git push
          fi